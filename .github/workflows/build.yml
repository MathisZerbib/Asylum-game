name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and desktop
        run: ./gradlew :composeApp:assembleRelease :composeApp:desktopJar --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: last-asylum-apk
          path: composeApp/build/outputs/apk/release/*.apk

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Bot plays 11 minutes, screenshots from the real renderer
        run: ./gradlew -p verify run --args="build/shots 11"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: verify/build/shots/*.png

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
